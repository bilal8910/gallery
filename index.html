function getThumb(p){ return BASE+p[0]+"/s400/"+p[1]; }
function getFull(p){ return BASE+p[0]+"/s2252/"+p[1]; }


var curLang = 'ar';
var curIdx = 0;
var cards = [];

var T = {
  ar: { dir:'rtl', lname:'القصر الصغير', lback:'← الرئيسية',
        htitle:'معرض <em>الصور</em>', hdesc:'بعدسة بلال الهيشو — القصر الصغير، المغرب',
        fall:'🌟 الكل', fbeach:'🌊 الشاطئ', fsunset:'🌅 الغروب',
        fnature:'🌿 الطبيعة', fnight:'🌙 الليل', fport:'⚓ الميناء' },
  fr: { dir:'ltr', lname:'Ksar Sghir', lback:'← Accueil',
        htitle:'Galerie <em>Photos</em>', hdesc:'Par Bilal El Hichou — Ksar Sghir, Maroc',
        fall:'🌟 Tout', fbeach:'🌊 Plage', fsunset:'🌅 Coucher',
        fnature:'🌿 Nature', fnight:'🌙 Nuit', fport:'⚓ Port' },
  en: { dir:'ltr', lname:'Ksar Sghir', lback:'← Home',
        htitle:'Photo <em>Gallery</em>', hdesc:'By Bilal El Hichou — Ksar Sghir, Morocco',
        fall:'🌟 All', fbeach:'🌊 Beach', fsunset:'🌅 Sunset',
        fnature:'🌿 Nature', fnight:'🌙 Night', fport:'⚓ Port' }
};

function setL(lang) {
  curLang = lang;
  var t = T[lang];
  document.documentElement.setAttribute('dir', t.dir);
  document.body.setAttribute('dir', t.dir);
  ['lname','lback','fall','fbeach','fsunset','fnature','fcity','fport'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = t[id];
  });
  document.getElementById('htitle').innerHTML = t.htitle;
  document.getElementById('hdesc').innerHTML = t.hdesc;
  // Update card names
  document.querySelectorAll('.card .name').forEach(function(el) {
    var val = el.getAttribute('data-' + lang);
    if (val) el.textContent = val;
  });
  // Update buttons
  document.querySelectorAll('.lb').forEach(function(b) {
    b.classList.remove('on');
    if (b.getAttribute('onclick') === "setL('" + lang + "')") b.classList.add('on');
  });
  try { localStorage.setItem('gl', lang); } catch(e) {}
}

function filter(btn, cat) {
  document.querySelectorAll('.fbtn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  resetGallery(cat);
}

function getCards() {
  return Array.from(document.querySelectorAll('.card:not(.hidden)'));
}

function openCard(el) {
  cards = getCards();
  curIdx = cards.indexOf(el);
  showCard(curIdx);
}

function showCard(idx) {
  var el = cards[idx];
  var img = el.querySelector('img'); var fullSrc = img.getAttribute('data-full') || img.src;
  var ph = el.querySelector('.ph');
  var name = el.querySelector('.name');
  var title = name ? (name.getAttribute('data-' + curLang) || name.textContent) : '';
  var lbc = document.getElementById('lbcontent');
  document.getElementById('lbtitle').textContent = title;
  document.getElementById('lbox').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (img) {
    // Use proxy to bypass CORS then draw watermark on canvas
    var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(img.src);
    var i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = function() {
      var c = document.createElement('canvas');
      c.width = i.naturalWidth;
      c.height = i.naturalHeight;
      var ctx = c.getContext('2d');
      ctx.drawImage(i, 0, 0);
      // Draw watermark
      var wm = '© Bilal El Hichou  |  ksarsghir.com';
      var fs = Math.max(18, Math.floor(i.naturalWidth * 0.025));
      ctx.font = 'bold ' + fs + 'px Arial';
      var tw = ctx.measureText(wm).width;
      var pad = fs * 0.7;
      var x = i.naturalWidth - tw - pad * 2 - 10;
      var y = i.naturalHeight - fs * 0.8 - 10;
      // Background
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.roundRect(x - pad, y - fs, tw + pad * 2, fs * 1.7, 4);
      ctx.fill();
      // Text
      ctx.fillStyle = '#00b4d8';
      ctx.fillText(wm, x, y);
      lbc.innerHTML = '<img src="' + c.toDataURL('image/jpeg', 0.92) + '" alt="' + title + '" style="max-width:90vw;max-height:70vh;object-fit:contain;border-radius:6px;display:block;"/>';
    };
    i.onerror = function() {
      // Fallback: CSS watermark
      lbc.innerHTML = '<div class="lb-img-wrap">' +
        '<img src="' + img.src + '" alt="' + title + '"/>' +
        '<div class="watermark">&#169; Bilal El Hichou | ksarsghir.com</div>' +
        '</div>';
    };
    lbc.innerHTML = '<div style="color:#90e0ef;font-size:13px;padding:30px;text-align:center;">&#128247; جاري التحميل...</div>';
    i.src = proxyUrl;
  } else if (ph) {
    lbc.innerHTML = '<div class="lb-ph">' + ph.innerHTML + '</div>';
  }
}

function nextCard() { curIdx = (curIdx + 1) % cards.length; showCard(curIdx); }
function prevCard() { curIdx = (curIdx - 1 + cards.length) % cards.length; showCard(curIdx); }

function closeLb() {
  document.getElementById('lbox').classList.remove('on');
  document.body.style.overflow = '';
}

document.getElementById('lbox').addEventListener('click', function(e) {
  if (e.target === this) closeLb();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') nextCard();
  if (e.key === 'ArrowRight') prevCard();
});

// Init
function toggleMode() {
  var body = document.body;
  var btn = document.getElementById('modeBtn');
  if (body.classList.contains('light-mode')) {
    body.classList.remove('light-mode');
    btn.textContent = '🌙';
    try { localStorage.setItem('mode', 'dark'); } catch(e) {}
  } else {
    body.classList.add('light-mode');
    btn.textContent = '☀️';
    try { localStorage.setItem('mode', 'light'); } catch(e) {}
  }
}

(function() {
  var s = 'ar';
  try { s = localStorage.getItem('gl') || 'ar'; } catch(e) {}
  setL(s);
  var m = 'dark';
  try { m = localStorage.getItem('mode') || 'dark'; } catch(e) {}
  if (m === 'light') {
    document.body.classList.add('light-mode');
    var btn = document.getElementById('modeBtn');
    if (btn) btn.textContent = '☀️';
  }
})();

// ===== PAGINATION =====
var PAGE_SIZE = 24;
var currentPage = 0;
var currentCat = 'all';
var filteredPhotos = [];

function getFiltered() {
  if (currentCat === 'all') return allPhotos;
  return allPhotos.filter(function(p){ return p[2] === currentCat; });
}

var CATS_AR = ['طبيعة','شاطئ','ميناء','غروب','مدينة'];
var CATS_FR = ['Nature','Plage','Port','Coucher','Ville'];
var CATS_EN = ['Nature','Beach','Port','Sunset','City'];
var CATS_KEY = ['nature','beach','port','sunset','city'];

function getCatAr(cat){ var i=CATS_KEY.indexOf(cat); return i>=0?CATS_AR[i]:cat; }
function getCatFr(cat){ var i=CATS_KEY.indexOf(cat); return i>=0?CATS_FR[i]:cat; }
function getCatEn(cat){ var i=CATS_KEY.indexOf(cat); return i>=0?CATS_EN[i]:cat; }

function renderCard(p) {
  var div = document.createElement('div');
  var cat = p[2];
  div.className = 'card';
  div.setAttribute('data-cat', cat);
  div.setAttribute('onclick', 'openCard(this)');
  div.innerHTML = '<img src="'+getThumb(p)+'" data-full="'+getFull(p)+'" alt="القصر الصغير" loading="lazy"/>' +
    '<div class="info"><div class="name" data-ar="القصر الصغير" data-fr="Ksar Sghir" data-en="Ksar Sghir">القصر الصغير</div>' +
    '<span class="cat" data-ar="'+getCatAr(cat)+'" data-fr="'+getCatFr(cat)+'" data-en="'+getCatEn(cat)+'">'+getCatAr(cat)+'</span></div>';
  return div;
}

function loadMore() {
  var grid = document.getElementById('grid');
  var start = currentPage * PAGE_SIZE;
  var end = start + PAGE_SIZE;
  var batch = filteredPhotos.slice(start, end);
  batch.forEach(function(p) {
    grid.appendChild(renderCard(p));
  });
  currentPage++;
  updateLoadMore();
}

function updateLoadMore() {
  var remaining = filteredPhotos.length - (currentPage * PAGE_SIZE);
  var btn = document.getElementById('load-more-btn');
  var wrap = document.getElementById('load-more-wrap');
  var countEl = document.getElementById('load-more-count');
  if (remaining <= 0) {
    wrap.style.display = 'none';
  } else {
    wrap.style.display = 'block';
    countEl.textContent = remaining;
  }
}

function resetGallery(cat) {
  currentCat = cat || 'all';
  currentPage = 0;
  filteredPhotos = getFiltered();
  document.getElementById('grid').innerHTML = '';
  loadMore();
}

// Override filter function
var origFilter = typeof filter === 'function' ? filter : null;
/* filter defined above */

// Init on load
document.addEventListener('DOMContentLoaded', function() {
  resetGallery('all');
});
